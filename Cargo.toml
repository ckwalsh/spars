[package]
name = "spars"
version = "0.0.0"
rust-version = "1.85.1"
edition = "2021"

[profile.plaid]
inherits = "release"
opt-level = "z"
strip = true
overflow-checks = false
lto = "fat"
panic = "abort"
codegen-units = 1

[features]
default = []
mime_guess = ["dep:mime_guess"]
signal-hook = ["dep:signal-hook"]

[dependencies]
async-executor = "1.13.2"
async-io = "2.5.0"
blocking = "1.6.2"
compact_str = "0.9.0"
futures-lite = "2.6.1"
httparse = "1.10.1"
mime_guess = { version = "2.0.5", optional = true }
signal-hook = { version = "0.3.18", optional = true }
thiserror = "2.0.15"
zerotrie = { version = "0.2.2", features = ["alloc"] }
